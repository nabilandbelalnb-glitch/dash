 <title>Profit Calculator</title>
</head>

<body>
 <span id="home"><a href="index.html">To Dashboard</a></span>
 <h1 class="header">Product Profit Calculator</h1>
 <div class="container">
  <form id="profitForm">
   <label for="costPrice">Cost Price per Unit ($):</label>
   <input type="number" id="number" step="0.01" required placeholder="Click Here">

   <label for="sellingPrice">Selling Price per Unit ($):</label>
   <input type="number" id="number2" step="0.01" required placeholder="Click Here">

   <label for="quantity">Quantity Sold:</label>
   <input type="number" id="amount" min="1" required placeholder="Click Here">
   <button type="button" id="submit">Calculate Profit</button>
  </form>
  <div id="result"></div>
 </div>
 <script src="profit.js.js"></script>
</body>

</html>
